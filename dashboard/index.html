<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Poweride Cyprus — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3248;--accent:#00c896;--accent2:#0099ff;--danger:#ff4d6a;--warning:#ffb547;--text:#f0f2ff;--muted:#8890b0;--font:'Inter',system-ui,sans-serif;--radius:10px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh;}
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.5rem 2rem;width:340px;text-align:center;}
  .login-box .logo{font-size:22px;font-weight:700;margin-bottom:6px;} .login-box .logo span{color:var(--accent);}
  .login-box p{color:var(--muted);font-size:13px;margin-bottom:1.75rem;}
  .login-box input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:var(--radius);padding:10px 14px;font-size:14px;margin-bottom:10px;outline:none;}
  .login-box input:focus{border-color:var(--accent);}
  .login-box button{width:100%;background:var(--accent);color:#000;border:none;border-radius:var(--radius);padding:11px;font-size:14px;font-weight:600;cursor:pointer;}
  #login-error{color:var(--danger);font-size:12px;margin-top:8px;display:none;}
  #app{display:none;flex-direction:column;min-height:100vh;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 1.5rem;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .header-logo{font-size:16px;font-weight:700;} .header-logo span{color:var(--accent);}
  .logout-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;}
  nav{background:var(--surface);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 1rem;}
  nav button{background:transparent;border:none;color:var(--muted);padding:12px 16px;font-size:13px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);}
  main{padding:1.5rem;max-width:1200px;width:100%;margin:0 auto;flex:1;}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:1.5rem;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;}
  .stat-card .label{color:var(--muted);font-size:12px;margin-bottom:6px;}
  .stat-card .value{font-size:26px;font-weight:700;}
  .green{color:var(--accent);} .blue{color:var(--accent2);} .red{color:var(--danger);}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:1.5rem;}
  .table-header{padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap;}
  .table-header h3{font-size:14px;font-weight:600;}
  .search-box{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 12px;font-size:13px;outline:none;width:200px;}
  .search-box:focus{border-color:var(--accent);}
  .filter-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;}
  .filter-btn.active{background:var(--accent);color:#000;border-color:var(--accent);}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;padding:10px 14px;color:var(--muted);font-size:12px;font-weight:500;border-bottom:1px solid var(--border);}
  td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;}
  tr:last-child td{border-bottom:none;} tr:hover td{background:var(--surface2);}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
  .badge.green{background:rgba(0,200,150,.15);color:var(--accent);}
  .badge.red{background:rgba(255,77,106,.15);color:var(--danger);}
  .badge.yellow{background:rgba(255,181,71,.15);color:var(--warning);}
  .badge.blue{background:rgba(0,153,255,.15);color:var(--accent2);}
  .btn{border:none;border-radius:8px;padding:7px 14px;font-size:13px;font-weight:500;cursor:pointer;}
  .btn-primary{background:var(--accent);color:#000;}
  .btn-danger{background:rgba(255,77,106,.15);color:var(--danger);border:1px solid rgba(255,77,106,.3);}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-invoice{background:rgba(0,153,255,.15);color:var(--accent2);border:1px solid rgba(0,153,255,.3);}
  .btn-sm{padding:4px 10px;font-size:12px;}
  .form-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;}
  .form-box h3{font-size:14px;font-weight:600;margin-bottom:1rem;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
  .form-grid input,.form-grid select,.form-grid textarea{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:9px 12px;font-size:13px;width:100%;outline:none;font-family:var(--font);}
  .form-grid input:focus,.form-grid select:focus{border-color:var(--accent);}
  .form-grid select option{background:var(--surface);}
  .form-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
  .section-gap{margin-bottom:1.5rem;}
  .empty{padding:2rem;text-align:center;color:var(--muted);}
  .alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:1rem;}
  .alert.danger{background:rgba(255,77,106,.1);color:var(--danger);border:1px solid rgba(255,77,106,.3);}
  .loading{text-align:center;color:var(--muted);padding:2rem;}
  .clickable{cursor:pointer;color:var(--accent2);text-decoration:underline;}

  /* MODAL */
  .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem;}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.5rem;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:16px;font-weight:600;margin-bottom:1rem;}
  .modal-actions{display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap;}

  /* INVOICE PREVIEW */
  .invoice-preview{background:#fff;color:#000;padding:2rem;border-radius:8px;font-family:'Arial',sans-serif;font-size:12px;max-width:700px;margin:0 auto;}
  .inv-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid #000;}
  .inv-logo{font-size:20px;font-weight:900;letter-spacing:-0.5px;}
  .inv-logo small{display:block;font-size:10px;font-weight:400;letter-spacing:1px;}
  .inv-title{font-size:24px;font-weight:900;text-align:right;}
  .inv-seller{font-size:11px;line-height:1.6;margin-bottom:1.5rem;}
  .inv-table{width:100%;border-collapse:collapse;margin-bottom:1rem;}
  .inv-table th{background:#000;color:#fff;padding:6px 10px;text-align:left;font-size:11px;}
  .inv-table td{padding:6px 10px;border-bottom:1px solid #ddd;font-size:11px;}
  .inv-total{background:#000;color:#fff;padding:8px 10px;font-weight:700;font-size:13px;text-align:center;margin-bottom:1.5rem;}
  .inv-sigs{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:1rem;}
  .inv-sig-box{border-top:1px solid #000;padding-top:8px;font-size:10px;}
  .inv-footer{text-align:center;font-style:italic;font-size:11px;margin-top:1rem;color:#666;}
</style>
</head>

<div id="login-screen">
  <div class="login-box">
    <div class="logo">Poweride<span>CY</span></div>
    <p>Dashboard διαχείρισης</p>
    <input type="text" id="lu" placeholder="Username" />
    <input type="password" id="lp" placeholder="Password" />
    <button id="login-btn">Είσοδος</button>
    <div id="login-error">Λάθος username ή password</div>
  </div>
</div>

<div id="app">
  <header>
    <div class="header-logo">Poweride<span>CY</span> Dashboard</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="color:var(--muted);font-size:12px;">andreass1978</span>
      <button class="logout-btn" id="logout-btn">Αποσύνδεση</button>
    </div>
  </header>
  <nav id="main-nav">
    <button data-tab="overview" class="active">📊 Επισκόπηση</button>

    <button data-tab="customers">👥 Πελάτες</button>

    <button data-tab="orders">🧾 Παραγγελίες</button>
    <button data-tab="stock">📋 Απόθεμα</button>
  </nav>
  <main id="mc"><div class="loading">Φόρτωση...</div></main>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal" id="modal-box"></div>
</div>

function H(x){return{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':x||''};}
function GET(t,q){return fetch(SB+t+'?'+(q||''),{headers:H()}).then(function(r){return r.json();});}
function POST(t,b){return fetch(SB+t,{method:'POST',headers:H('return=representation'),body:JSON.stringify(b)}).then(function(r){return r.json();});}
function PATCH(t,id,b){return fetch(SB+t+'?id=eq.'+id,{method:'PATCH',headers:H('return=representation'),body:JSON.stringify(b)}).then(function(r){return r.json();});}
function DEL(t,id){return fetch(SB+t+'?id=eq.'+id,{method:'DELETE',headers:H()}).then(function(r){return r.status;});}
function fmt(n){return Number(n||0).toLocaleString('el-GR',{minimumFractionDigits:2,maximumFractionDigits:2})+' \u20ac';}
function fd(d){return d?new Date(d).toLocaleDateString('el-GR'):'--';}
function g(id){return document.getElementById(id);}
function v(id){var e=g(id);return e?e.value:'';}
function closeModal(){g('modal-overlay').style.display='none';}

// Receipt number generator
function receiptNum(n){return 'A'+String(n).padStart(5,'0');}

// AUTH
g('login-btn').addEventListener('click',function(){
  if(v('lu')===U&&v('lp')===P){sessionStorage.setItem('pcy','1');g('login-screen').style.display='none';g('app').style.cssText='display:flex;flex-direction:column;min-height:100vh;';load(tab);}
  else{g('login-error').style.display='block';}
});
g('logout-btn').addEventListener('click',function(){sessionStorage.removeItem('pcy');location.reload();});
g('main-nav').addEventListener('click',function(e){
  var b=e.target.closest('[data-tab]');if(!b)return;
  document.querySelectorAll('#main-nav button').forEach(function(x){x.classList.remove('active');});
  b.classList.add('active');tab=b.dataset.tab;eid=null;orderFilter='all';searchQ='';load(tab);
});
g('modal-overlay').addEventListener('click',function(e){if(e.target===this)closeModal();});
if(sessionStorage.getItem('pcy')){g('login-screen').style.display='none';g('app').style.cssText='display:flex;flex-direction:column;min-height:100vh;';}

function load(t){
  var mc=g('mc');mc.innerHTML='<div class="loading">Φόρτωση...</div>';
  if(t==='overview')doOverview(mc);
  else if(t==='products')doProducts(mc);
  else if(t==='customers')doCustomers(mc);
  else if(t==='suppliers')doSuppliers(mc);
  else if(t==='orders')doOrders(mc);
  else if(t==='stock')doStock(mc);
}

// OVERVIEW
function doOverview(mc){
  Promise.all([GET('products','select=*'),GET('customers','select=*'),GET('orders','select=*')]).then(function(r){
    var PR=r[0],C=r[1],O=r[2];
    var rev=O.filter(function(o){return o.status==='Ολοκληρωμένη';}).reduce(function(s,o){return s+o.qty*o.unit_price;},0);
    var low=PR.filter(function(p){return p.stock<=2;});
    var rows=O.slice().sort(function(a,b){return new Date(b.date)-new Date(a.date);}).slice(0,8).map(function(o){
      var pr=PR.find(function(p){return p.id===o.product_id;});
      var cu=C.find(function(c){return c.id===o.customer_id;});
      var bg=o.status==='Ολοκληρωμένη'?'green':o.status==='Ακυρωμένη'?'red':'yellow';
      return '<tr><td>'+fd(o.date)+'</td><td>'+(cu?cu.name:'—')+'</td><td>'+(pr?pr.name:'—')+'</td><td>'+fmt(o.qty*o.unit_price)+'</td><td><span class="badge '+bg+'">'+o.status+'</span></td></tr>';
    }).join('');
    mc.innerHTML='<div class="stats">'
      +'<div class="stat-card"><div class="label">Προϊόντα</div><div class="value blue">'+PR.length+'</div></div>'
      +'<div class="stat-card"><div class="label">Πελάτες</div><div class="value">'+C.length+'</div></div>'
      +'<div class="stat-card"><div class="label">Παραγγελίες</div><div class="value">'+O.length+'</div></div>'
      +'<div class="stat-card"><div class="label">Έσοδα</div><div class="value green">'+fmt(rev)+'</div></div>'
      +'<div class="stat-card"><div class="label">Σε εξέλιξη</div><div class="value blue">'+O.filter(function(o){return o.status==='Σε εξέλιξη';}).length+'</div></div>'
      +'<div class="stat-card"><div class="label">Χαμηλό stock</div><div class="value '+(low.length>0?'red':'green')+'">'+low.length+'</div></div>'
      +'</div>'
      +(low.length>0?'<div class="alert danger">&#9888; Χαμηλό απόθεμα: '+low.map(function(p){return p.name+' ('+p.stock+')';}).join(', ')+'</div>':'')
      +'<div class="table-wrap"><div class="table-header"><h3>Τελευταίες παραγγελίες</h3></div>'
      +'<table><thead><tr><th>Ημ/νία</th><th>Πελάτης</th><th>Προϊόν</th><th>Σύνολο</th><th>Κατάσταση</th></tr></thead>'
      +'<tbody>'+(rows||'<tr><td colspan="5" class="empty">Δεν υπάρχουν παραγγελίες</td></tr>')+'</tbody></table></div>';
  });
}

// PRODUCTS
function doProducts(mc){
  Promise.all([GET('products','select=*&order=sku'),GET('suppliers','select=id,name')]).then(function(r){
    var PR=r[0],SP=r[1],ed=eid?PR.find(function(p){return p.id===eid;}):null;
    var filtered=PR.filter(function(p){return !searchQ||p.name.toLowerCase().includes(searchQ.toLowerCase())||p.sku.toLowerCase().includes(searchQ.toLowerCase());});
    var rows=filtered.map(function(p){
      return '<tr><td style="color:var(--muted)">'+p.sku+'</td><td style="font-weight:500">'+p.name+'</td><td>'+(p.category||'—')+'</td><td>'+fmt(p.cost)+'</td><td style="color:var(--accent);font-weight:600">'+fmt(p.price)+'</td>'
        +'<td><span class="badge '+(p.stock<=2?'red':p.stock<=5?'yellow':'green')+'">'+p.stock+'</span></td>'
        +'<td style="white-space:nowrap"><button class="btn btn-ghost btn-sm" onclick="sEdit(\'products\',\''+p.id+'\')">Επεξ.</button> <button class="btn btn-danger btn-sm" onclick="doDel(\'products\',\''+p.id+'\')">Διαγρ.</button></td></tr>';
    }).join('');
    var so=SP.map(function(s){return '<option value="'+s.id+'"'+(ed&&ed.supplier_id===s.id?' selected':'')+'>'+s.name+'</option>';}).join('');
    mc.innerHTML='<div class="table-wrap section-gap">'
      +'<div class="table-header"><h3>Προϊόντα ('+filtered.length+')</h3>'
      +'<input class="search-box" placeholder="🔍 Αναζήτηση..." value="'+searchQ+'" oninput="searchQ=this.value;doProducts(g(\'mc\'))" /></div>'
      +'<table><thead><tr><th>SKU</th><th>Όνομα</th><th>Κατηγορία</th><th>Κόστος</th><th>Τιμή</th><th>Stock</th><th></th></tr></thead>'
      +'<tbody>'+(rows||'<tr><td colspan="7" class="empty">Δεν βρέθηκαν προϊόντα</td></tr>')+'</tbody></table></div>'
      +'<div class="form-box"><h3>'+(ed?'Επεξεργασία: '+ed.name:'Νέο προϊόν')+'</h3><div class="form-grid">'
      +'<input id="psku" placeholder="SKU" value="'+(ed?ed.sku:'')+'" />'
      +'<input id="pname" placeholder="Όνομα" value="'+(ed?ed.name:'')+'" />'
      +'<input id="pcat" placeholder="Κατηγορία" value="'+(ed?ed.category||'':'')+'" />'
      +'<select id="psup"><option value="">Χωρίς προμηθευτή</option>'+so+'</select>'
      +'<input id="pcost" type="number" step="0.01" placeholder="Κόστος" value="'+(ed?ed.cost:'')+'" />'
      +'<input id="pprice" type="number" step="0.01" placeholder="Τιμή" value="'+(ed?ed.price:'')+'" />'
      +'<input id="pstock" type="number" placeholder="Stock" value="'+(ed?ed.stock:'')+'" /></div>'
      +'<div class="form-actions"><button class="btn btn-primary" onclick="saveProd()">'+(ed?'Αποθήκευση':'Προσθήκη')+'</button>'
      +(ed?'<button class="btn btn-ghost" onclick="eid=null;load(\'products\')">Ακύρωση</button>':'')+'</div></div>';
  });
}

// CUSTOMERS
function doCustomers(mc){
  Promise.all([GET('customers','select=*&order=name'),GET('orders','select=*')]).then(function(r){
    var C=r[0],O=r[1],ed=eid?C.find(function(c){return c.id===eid;}):null;
    var filtered=C.filter(function(c){return !searchQ||c.name.toLowerCase().includes(searchQ.toLowerCase())||((c.phone||'').includes(searchQ));});
    var rows=filtered.map(function(c){
      var cnt=O.filter(function(o){return o.customer_id===c.id;}).length;
      var total=O.filter(function(o){return o.customer_id===c.id&&o.status==='Ολοκληρωμένη';}).reduce(function(s,o){return s+o.qty*o.unit_price;},0);
      return '<tr><td style="font-weight:500"><span class="clickable" onclick="showCustomerHistory(\''+c.id+'\',\''+c.name+'\')">'+c.name+'</span></td>'
        +'<td>'+(c.phone||'—')+'</td><td style="color:var(--accent2)">'+(c.email||'—')+'</td><td>'+(c.city||'—')+'</td>'
        +'<td><span class="badge blue">'+cnt+'</span></td>'
        +'<td style="color:var(--accent)">'+fmt(total)+'</td>'

// STOCK
function doStock(mc){
  Promise.all([GET('products','select=*&order=stock'),GET('orders','select=product_id,qty,status')]).then(function(r){
    var PR=r[0],O=r[1];
    var lc=PR.filter(function(p){return p.stock<=2;}).length;
    var filtered=PR.filter(function(p){return !searchQ||p.name.toLowerCase().includes(searchQ.toLowerCase());});
    var rows=filtered.map(function(p){
      var sold=O.filter(function(o){return o.product_id===p.id&&o.status==='Ολοκληρωμένη';}).reduce(function(s,o){return s+o.qty;},0);
      var lv=p.stock<=2?['red','Χαμηλό']:p.stock<=5?['yellow','Μέτριο']:['green','Καλό'];
      return '<tr><td style="font-weight:500">'+p.name+'</td><td style="color:var(--muted)">'+p.sku+'</td>'
        +'<td style="font-weight:700;font-size:16px">'+p.stock+'</td><td>'+sold+'</td>'
        +'<td><span class="badge '+lv[0]+'">'+lv[1]+'</span></td><td>'+fmt(p.stock*p.cost)+'</td>'
        +'<td style="white-space:nowrap">'
        +'<button class="btn btn-ghost btn-sm" onclick="aStock(\''+p.id+'\','+p.stock+',-1)">−1</button> '
        +'<button class="btn btn-ghost btn-sm" onclick="aStock(\''+p.id+'\','+p.stock+',1)">+1</button> '
        +'<button class="btn btn-primary btn-sm" onclick="sStock(\''+p.id+'\','+p.stock+')">Ορισμός</button></td></tr>';
    }).join('');
    mc.innerHTML=(lc>0?'<div class="alert danger">&#9888; '+lc+' προϊόντα με χαμηλό απόθεμα (≤2)</div>':'')
      +'<div class="table-wrap"><div class="table-header"><h3>Απόθεμα</h3>'
      +'<input class="search-box" placeholder="🔍 Αναζήτηση..." value="'+searchQ+'" oninput="searchQ=this.value;doStock(g(\'mc\'))" /></div>'
      +'<table><thead><tr><th>Προϊόν</th><th>SKU</th><th>Απόθεμα</th><th>Πωλήθηκαν</th><th>Επίπεδο</th><th>Αξία</th><th>Ρύθμιση</th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table></div>';
  });
}

// ACTIONS
function fprice(sel){var o=sel.options[sel.selectedIndex];if(o&&o.dataset.price){var f=g('oprice');if(f)f.value=o.dataset.price;}}
function sEdit(t,id){eid=id;searchQ='';load(t);}

function doDel(t,id){
  if(!confirm('Διαγραφή;'))return;
  DEL(t,id).then(function(){eid=null;load(tab);}).catch(function(e){alert('Σφάλμα: '+e.message);});
}

function saveProd(){
  var b={sku:v('psku'),name:v('pname'),category:v('pcat'),supplier_id:v('psup')||null,cost:parseFloat(v('pcost'))||0,price:parseFloat(v('pprice'))||0,stock:parseInt(v('pstock'))||0};
  if(!b.name){alert('Βάλε όνομα');return;}
  (eid?PATCH('products',eid,b):POST('products',b)).then(function(){eid=null;load('products');});
}

function saveCust(){
  var b={name:v('cname'),phone:v('cphone'),email:v('cemail'),city:v('ccity'),notes:v('cnotes')};
  if(!b.name){alert('Βάλε όνομα');return;}
  (eid?PATCH('customers',eid,b):POST('customers',b)).then(function(){eid=null;load('customers');});
}

function saveSupp(){
  var b={name:v('sname'),contact:v('scont'),phone:v('sphone'),email:v('semail'),country:v('scountry'),notes:v('snotes')};
  if(!b.name){alert('Βάλε όνομα');return;}
  (eid?PATCH('suppliers',eid,b):POST('suppliers',b)).then(function(){eid=null;load('suppliers');});
}

function saveOrd(){
  var pid=v('oprod');if(!pid){alert('Επίλεξε προϊόν');return;}
  var qty=parseInt(v('oqty'))||1,st=v('ostatus');
  var b={date:v('odate'),customer_id:v('ocust')||null,product_id:pid,qty:qty,unit_price:parseFloat(v('oprice'))||0,status:st,notes:v('onotes')};
  if(eid){
    PATCH('orders',eid,b).then(function(){eid=null;load('orders');});
  } else {
    POST('orders',b).then(function(){
      if(st!=='Ακυρωμένη'){
        GET('products','select=id,stock&id=eq.'+pid).then(function(r){if(r[0])PATCH('products',pid,{stock:r[0].stock-qty});});
      }
      eid=null;load('orders');
    });
  }
}

function aStock(id,cur,d){PATCH('products',id,{stock:Math.max(0,cur+d)}).then(function(){load('stock');});}
function sStock(id,cur){
  var v2=prompt('Νέο απόθεμα:',cur);if(v2===null)return;
  var n=parseInt(v2);if(isNaN(n)||n<0){alert('Μη έγκυρος αριθμός');return;}
  PATCH('products',id,{stock:n}).then(function(){load('stock');});
}

if(sessionStorage.getItem('pcy'))load('overview');
</script>
